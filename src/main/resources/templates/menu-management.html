<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FoodRush — Menu Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1,h2,nav { font-family: 'Syne', sans-serif; }
        .input-field { width:100%; border:1px solid #e5e7eb; border-radius:0.5rem;
                       padding:0.5rem 0.75rem; font-size:0.875rem; outline:none; transition:border 0.2s; }
        .input-field:focus { border-color:#f97316; box-shadow:0 0 0 3px rgba(249,115,22,0.1); }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:100; align-items:center; justify-content:center; overflow-y:auto; padding:1rem; }
        .modal.open { display:flex; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ADMIN NAVBAR -->
<nav class="bg-gray-900 text-white sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-6">
            <a href="/" class="text-xl font-black text-orange-400">🍔 FoodRush</a>
            <span class="text-gray-400 text-sm">Admin Panel</span>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <a href="/admin/orders"    class="text-gray-300 hover:text-white">Orders</a>
            <a href="/admin/menu"      class="text-orange-400 font-semibold">Menu</a>
            <a href="/user/admin/list" class="text-gray-300 hover:text-white">Users</a>
            <a href="/user/logout"     class="text-red-400 hover:underline">Logout</a>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-3xl font-black text-gray-800">Menu Management</h1>
            <p class="text-gray-500 text-sm mt-1">Add, edit or remove menu items</p>
        </div>
        <button onclick="document.getElementById('addModal').classList.add('open')"
                class="bg-orange-500 text-white font-semibold px-5 py-2.5 rounded-xl hover:bg-orange-600 transition text-sm">
            + Add Item
        </button>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm" th:text="${success}"></div>

    <!-- ===== MENU TABLE ===== -->
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
        <div th:if="${menuItems.isEmpty()}" class="py-16 text-center text-gray-400">
            <div class="text-4xl mb-2">🍽️</div>
            <p>No menu items yet. Add your first item!</p>
        </div>

        <table th:if="${!menuItems.isEmpty()}" class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                <tr>
                    <th class="px-4 py-3 text-left">ID</th>
                    <th class="px-4 py-3 text-left">Name</th>
                    <th class="px-4 py-3 text-left">Type</th>
                    <th class="px-4 py-3 text-left">Category</th>
                    <th class="px-4 py-3 text-right">Base Price</th>
                    <th class="px-4 py-3 text-right">Final Price</th>
                    <th class="px-4 py-3 text-center">Available</th>
                    <th class="px-4 py-3 text-center">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
                <tr th:each="item : ${menuItems}" class="hover:bg-gray-50 transition">
                    <td class="px-4 py-3 text-gray-500 font-mono text-xs" th:text="${item.id}"></td>
                    <td class="px-4 py-3 font-semibold text-gray-800" th:text="${item.name}"></td>
                    <td class="px-4 py-3">
                        <!-- Show subclass type using instanceof check -->
                        <span th:if="${item instanceof T(com.fooddelivery.model.FoodItem)}"
                              class="text-xs bg-orange-50 text-orange-600 px-2 py-0.5 rounded-full font-medium">Food</span>
                        <span th:if="${item instanceof T(com.fooddelivery.model.Beverage)}"
                              class="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-medium">Beverage</span>
                        <span th:unless="${item instanceof T(com.fooddelivery.model.FoodItem) or item instanceof T(com.fooddelivery.model.Beverage)}"
                              class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full font-medium">Item</span>
                    </td>
                    <td class="px-4 py-3 text-gray-600" th:text="${item.category}"></td>
                    <td class="px-4 py-3 text-right text-gray-700">
                        Rs.<span th:text="${#numbers.formatDecimal(item.basePrice,1,2)}"></span>
                    </td>
                    <td class="px-4 py-3 text-right font-bold text-orange-600">
                        Rs.<span th:text="${#numbers.formatDecimal(item.calculatePrice(),1,2)}"></span>
                    </td>
                    <td class="px-4 py-3 text-center">
                        <form th:action="@{/admin/menu/toggle/{id}(id=${item.id})}" method="post" class="inline">
                            <button type="submit"
                                    th:class="${item.available} ? 'text-xs bg-green-50 text-green-600 px-2 py-1 rounded-full font-medium hover:bg-green-100' : 'text-xs bg-gray-100 text-gray-400 px-2 py-1 rounded-full font-medium hover:bg-gray-200'"
                                    th:text="${item.available} ? 'Yes' : 'No'">
                            </button>
                        </form>
                    </td>
                    <td class="px-4 py-3">
                        <div class="flex items-center justify-center gap-2">
                            <button th:data-id="${item.id}"
                                    th:data-name="${item.name}"
                                    th:data-price="${item.basePrice}"
                                    th:data-category="${item.category}"
                                    th:data-available="${item.available}"
                                    onclick="openEditModal(this.dataset)"
                                    class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded-lg hover:bg-blue-100 font-medium">
                                Edit
                            </button>
                            <form th:action="@{/admin/menu/delete/{id}(id=${item.id})}" method="post"
                                  onsubmit="return confirm('Delete this item?')">
                                <button type="submit"
                                        class="text-xs bg-red-50 text-red-500 px-2 py-1 rounded-lg hover:bg-red-100 font-medium">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ===== ADD ITEM MODAL ===== -->
<div id="addModal" class="modal">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 my-auto">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold text-gray-800">Add Menu Item</h2>
            <button onclick="document.getElementById('addModal').classList.remove('open')"
                    class="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>
        </div>

        <form th:action="@{/admin/menu/add}" method="post" class="space-y-4">
            <!-- Item type selector — controls which extra fields show -->
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Item Type</label>
                <select name="itemType" id="addItemType" onchange="toggleTypeFields('add')"
                        class="input-field">
                    <option value="food">Food Item</option>
                    <option value="beverage">Beverage</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Name</label>
                    <input type="text" name="name" required placeholder="e.g. Chicken Kottu" class="input-field"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Base Price (Rs.)</label>
                    <input type="number" name="basePrice" step="0.01" min="0" required placeholder="350.00" class="input-field"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Category</label>
                    <select name="category" class="input-field">
                        <option>Rice</option>
                        <option>Kottu</option>
                        <option>Noodles</option>
                        <option>Devilled</option>
                        <option>Dessert</option>
                        <option>Beverage</option>
                        <option>Snacks</option>
                    </select>
                </div>
            </div>

            <!-- Food-specific fields -->
            <div id="addFoodFields" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Cuisine</label>
                        <input type="text" name="cuisineType" placeholder="Sri Lankan" class="input-field"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Packaging Fee (Rs.)</label>
                        <input type="number" name="packagingFee" step="0.01" value="0" class="input-field"/>
                    </div>
                </div>
                <label class="flex items-center gap-2 text-sm text-gray-600">
                    <input type="checkbox" name="isSpicy" value="true" class="rounded accent-orange-500"/>
                    Spicy item
                </label>
            </div>

            <!-- Beverage-specific fields -->
            <div id="addBeverageFields" class="hidden space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Size</label>
                    <select name="size" class="input-field">
                        <option value="Small">Small</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Large">Large</option>
                    </select>
                </div>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input type="checkbox" name="isCold" value="true" checked class="accent-orange-500"/> Cold drink
                    </label>
                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input type="checkbox" name="hasCaffeine" value="true" class="accent-orange-500"/> Has caffeine
                    </label>
                </div>
            </div>

            <label class="flex items-center gap-2 text-sm text-gray-600">
                <input type="checkbox" name="available" value="true" checked class="accent-orange-500"/>
                Available on menu
            </label>

            <div class="flex gap-3 pt-2">
                <button type="submit"
                        class="flex-1 bg-orange-500 text-white font-semibold py-2.5 rounded-xl hover:bg-orange-600 transition text-sm">
                    Add Item
                </button>
                <button type="button" onclick="document.getElementById('addModal').classList.remove('open')"
                        class="flex-1 bg-gray-100 text-gray-600 font-semibold py-2.5 rounded-xl hover:bg-gray-200 transition text-sm">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ===== EDIT ITEM MODAL ===== -->
<div id="editModal" class="modal">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 my-auto">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold text-gray-800">Edit Menu Item</h2>
            <button onclick="document.getElementById('editModal').classList.remove('open')"
                    class="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>
        </div>
        <form th:action="@{/admin/menu/update}" method="post" class="space-y-4">
            <input type="hidden" name="id" id="editId"/>
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Name</label>
                    <input type="text" name="name" id="editName" required class="input-field"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Base Price</label>
                    <input type="number" name="basePrice" id="editPrice" step="0.01" class="input-field"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Category</label>
                    <input type="text" name="category" id="editCategory" class="input-field"/>
                </div>
            </div>
            <input type="hidden" name="itemType" id="editItemType" value="food"/>
            <label class="flex items-center gap-2 text-sm text-gray-600">
                <input type="checkbox" name="available" id="editAvailable" value="true" class="accent-orange-500"/>
                Available on menu
            </label>
            <div class="flex gap-3 pt-2">
                <button type="submit"
                        class="flex-1 bg-orange-500 text-white font-semibold py-2.5 rounded-xl hover:bg-orange-600 transition text-sm">
                    Save Changes
                </button>
                <button type="button" onclick="document.getElementById('editModal').classList.remove('open')"
                        class="flex-1 bg-gray-100 text-gray-600 font-semibold py-2.5 rounded-xl hover:bg-gray-200 transition text-sm">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<!-- We embed menu data as JS for the edit modal -->
<script th:inline="javascript">
    const menuData = {};
    /*<![CDATA[*/
    const items = /*[[${menuItems}]]*/ [];
    /*]]>*/

    function toggleTypeFields(prefix) {
        const type = document.getElementById(prefix + 'ItemType').value;
        document.getElementById(prefix + 'FoodFields')     && (document.getElementById(prefix + 'FoodFields').classList.toggle('hidden', type !== 'food'));
        document.getElementById(prefix + 'BeverageFields') && (document.getElementById(prefix + 'BeverageFields').classList.toggle('hidden', type !== 'beverage'));
    }

    function openEditModal(data) {
        document.getElementById('editId').value        = data.id;
        document.getElementById('editName').value      = data.name;
        document.getElementById('editPrice').value     = data.price;
        document.getElementById('editCategory').value  = data.category;
        document.getElementById('editAvailable').checked = (data.available === 'true');
        
        document.getElementById('editModal').classList.add('open');
    }

    // Close modals on backdrop click
    ['addModal','editModal'].forEach(modalId => {
        document.getElementById(modalId).addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('open');
        });
    });
</script>
</body>
</html>
