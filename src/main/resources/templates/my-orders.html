<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FoodRush — My Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1,nav { font-family: 'Syne', sans-serif; }
        .status-pill { font-size:0.7rem; font-weight:600; padding:2px 10px; border-radius:9999px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="/" class="text-2xl font-black text-orange-500">🍔 FoodRush</a>
        <div class="flex items-center gap-4 text-sm">
            <a href="/order/place" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-orange-600 transition">+ New Order</a>
            <a href="/user/logout" class="text-red-400 hover:underline">Logout</a>
        </div>
    </div>
</nav>

<div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-black text-gray-800 mb-2">My Orders</h1>
    <p class="text-gray-500 text-sm mb-6">Track and manage your food orders.</p>

    <div th:if="${success}" class="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm" th:text="${success}"></div>

    <div th:if="${orders.isEmpty()}" class="text-center py-16 text-gray-400">
        <div class="text-5xl mb-4">🛵</div>
        <p class="text-lg mb-4">No orders yet.</p>
        <a href="/order/place" class="bg-orange-500 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-orange-600 transition text-sm">
            Place Your First Order
        </a>
    </div>

    <div class="space-y-4">
        <div th:each="order : ${orders}"
             class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <!-- Order header -->
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-50">
                <div>
                    <span class="font-bold text-gray-800">Order #<span th:text="${order.id}"></span></span>
                    <span class="text-gray-400 text-xs ml-2" th:text="${order.orderDate}"></span>
                </div>
                <div class="flex items-center gap-3">
                    <span th:text="${order.status}"
                          th:classappend="${order.status == 'Delivered'} ? 'bg-green-100 text-green-700' :
                                         (${order.status == 'Cancelled'} ? 'bg-red-100 text-red-600' :
                                         (${order.status == 'Pending'} ? 'bg-yellow-100 text-yellow-700' : 'bg-blue-100 text-blue-700'))"
                          class="status-pill">
                    </span>
                    <!-- Cancel button only for Pending orders -->
                    <form th:if="${order.status == 'Pending'}"
                          th:action="@{/order/cancel/{id}(id=${order.id})}"
                          method="post"
                          onsubmit="return confirm('Cancel this order?')">
                        <button type="submit"
                                class="text-xs text-red-400 hover:text-red-600 hover:underline">
                            Cancel
                        </button>
                    </form>
                </div>
            </div>

            <!-- Order items -->
            <div class="px-5 py-3">
                <div th:each="item : ${order.items}"
                     class="flex justify-between text-sm py-1">
                    <span class="text-gray-700">
                        <span th:text="${item.menuItemName}"></span>
                        <span class="text-gray-400"> ×<span th:text="${item.quantity}"></span></span>
                    </span>
                    <span class="text-gray-600">
                        Rs.<span th:text="${#numbers.formatDecimal(item.subtotal,1,2)}"></span>
                    </span>
                </div>
            </div>

            <!-- Order footer -->
            <div class="flex items-center justify-between px-5 py-3 bg-gray-50">
                <span class="text-xs text-gray-500" th:text="${order.deliveryAddress}"></span>
                <span class="font-black text-orange-600">
                    Rs.<span th:text="${#numbers.formatDecimal(order.totalAmount,1,2)}"></span>
                </span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
