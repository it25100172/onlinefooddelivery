<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FoodRush — Login / Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1,h2 { font-family: 'Syne', sans-serif; }
        .tab-active   { border-bottom: 3px solid #f97316; color: #f97316; font-weight: 700; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #6b7280; }
        .input-field  { width:100%; border:1px solid #e5e7eb; border-radius:0.5rem; padding:0.6rem 0.9rem;
                        font-size:0.9rem; outline:none; transition:border 0.2s; }
        .input-field:focus { border-color:#f97316; box-shadow:0 0 0 3px rgba(249,115,22,0.1); }
        .btn-primary  { background:#f97316; color:white; width:100%; padding:0.7rem; border-radius:0.5rem;
                        font-weight:600; font-size:0.95rem; cursor:pointer; transition:background 0.2s; border:none; }
        .btn-primary:hover { background:#ea6c0a; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 flex items-center justify-center px-4 py-10">

<div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-6">
        <a href="/" class="text-3xl font-black text-orange-500" style="font-family:'Syne',sans-serif">🍔 FoodRush</a>
        <p class="text-gray-500 text-sm mt-1">Fast delivery, great food</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

        <!-- Tabs -->
        <div class="flex border-b border-gray-100" id="tabs">
            <button onclick="showTab('login')" id="tab-login"
                    class="flex-1 py-4 text-sm tab-active">Login</button>
            <button onclick="showTab('register')" id="tab-register"
                    class="flex-1 py-4 text-sm tab-inactive">Register</button>
        </div>

        <div class="p-6">

            <!-- Flash messages -->
            <div th:if="${success}" class="mb-4 bg-green-50 border border-green-200 text-green-700 px-3 py-2 rounded-lg text-sm" th:text="${success}"></div>
            <div th:if="${error}"   class="mb-4 bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg text-sm" th:text="${error}"></div>

            <!-- ===== LOGIN FORM ===== -->
            <div id="login-form">
                <h2 class="text-xl font-bold text-gray-800 mb-5">Welcome back</h2>
                <form th:action="@{/user/login}" method="post">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Email</label>
                            <input type="email" name="email" required placeholder="you@example.com" class="input-field"/>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Password</label>
                            <input type="password" name="password" required placeholder="••••••••" class="input-field"/>
                        </div>
                        <button type="submit" class="btn-primary mt-2">Login →</button>
                    </div>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">
                    No account?
                    <button onclick="showTab('register')" class="text-orange-500 font-semibold hover:underline">Register here</button>
                </p>
                <!-- Admin hint for testing -->
                <div class="mt-4 p-3 bg-gray-50 rounded-lg text-xs text-gray-400">
                    <strong>Admin test login:</strong> admin@foodrush.com / admin123
                </div>
            </div>

            <!-- ===== REGISTER FORM ===== -->
            <div id="register-form" class="hidden">
                <h2 class="text-xl font-bold text-gray-800 mb-5">Create account</h2>
                <form th:action="@{/user/register}" method="post">
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Full Name</label>
                            <input type="text" name="name" required placeholder="John Silva" class="input-field"/>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Email</label>
                            <input type="email" name="email" required placeholder="you@example.com" class="input-field"/>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Password</label>
                            <input type="password" name="password" required placeholder="Min 6 characters" class="input-field"/>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Phone</label>
                            <input type="text" name="phone" required placeholder="077 123 4567" class="input-field"/>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">Delivery Address</label>
                            <textarea name="deliveryAddress" required rows="2" placeholder="No 5, Main Street, Colombo" class="input-field resize-none"></textarea>
                        </div>
                        <button type="submit" class="btn-primary mt-2">Create Account →</button>
                    </div>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">
                    Already registered?
                    <button onclick="showTab('login')" class="text-orange-500 font-semibold hover:underline">Login</button>
                </p>
            </div>

        </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-4">
        <a href="/" class="hover:text-orange-400">← Back to menu</a>
    </p>
</div>

<script>
    function showTab(tab) {
        const loginForm    = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const tabLogin     = document.getElementById('tab-login');
        const tabRegister  = document.getElementById('tab-register');

        if (tab === 'login') {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            tabLogin.className    = 'flex-1 py-4 text-sm tab-active';
            tabRegister.className = 'flex-1 py-4 text-sm tab-inactive';
        } else {
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            tabRegister.className = 'flex-1 py-4 text-sm tab-active';
            tabLogin.className    = 'flex-1 py-4 text-sm tab-inactive';
        }
    }
</script>
</body>
</html>
