<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FoodRush — Order Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1,h2,nav { font-family: 'Syne', sans-serif; }
        .status-Pending       { background:#fef3c7; color:#92400e; }
        .status-Confirmed     { background:#dbeafe; color:#1e40af; }
        .status-Preparing     { background:#ede9fe; color:#5b21b6; }
        .status-Out           { background:#d1fae5; color:#065f46; }
        .status-Delivered     { background:#f0fdf4; color:#166534; }
        .status-Cancelled     { background:#fee2e2; color:#991b1b; }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center; }
        .modal.open { display:flex; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ADMIN NAVBAR -->
<nav class="bg-gray-900 text-white sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-6">
            <a href="/" class="text-xl font-black text-orange-400">🍔 FoodRush</a>
            <span class="text-gray-400 text-sm">Admin Panel</span>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <a href="/admin/orders"    class="text-orange-400 font-semibold">Orders</a>
            <a href="/admin/menu"      class="text-gray-300 hover:text-white">Menu</a>
            <a href="/user/admin/list" class="text-gray-300 hover:text-white">Users</a>
            <a href="/user/logout"     class="text-red-400 hover:underline">Logout</a>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-black text-gray-800 mb-2">Order Management</h1>

    <!-- Flash messages -->
    <div th:if="${success}" class="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm" th:text="${success}"></div>

    <!-- ===== SUMMARY CARDS ===== -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
        <div class="bg-yellow-50 rounded-xl p-4 text-center border border-yellow-100">
            <div class="text-2xl font-black text-yellow-600" th:text="${countPending}">0</div>
            <div class="text-xs text-yellow-700 font-medium mt-1">Pending</div>
        </div>
        <div class="bg-blue-50 rounded-xl p-4 text-center border border-blue-100">
            <div class="text-2xl font-black text-blue-600" th:text="${countConfirmed}">0</div>
            <div class="text-xs text-blue-700 font-medium mt-1">Confirmed</div>
        </div>
        <div class="bg-green-50 rounded-xl p-4 text-center border border-green-100">
            <div class="text-2xl font-black text-green-600" th:text="${countOut}">0</div>
            <div class="text-xs text-green-700 font-medium mt-1">Out for Delivery</div>
        </div>
        <div class="bg-emerald-50 rounded-xl p-4 text-center border border-emerald-100">
            <div class="text-2xl font-black text-emerald-600" th:text="${countDelivered}">0</div>
            <div class="text-xs text-emerald-700 font-medium mt-1">Delivered</div>
        </div>
    </div>

    <!-- ===== STATUS FILTER ===== -->
    <div class="flex flex-wrap gap-2 mb-6">
        <a href="/admin/orders"
           th:classappend="${selectedStatus == null} ? 'bg-gray-800 text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'"
           class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">All</a>
        <a th:each="s : ${allStatuses}"
           th:href="@{/admin/orders(status=${s})}"
           th:text="${s}"
           th:classappend="${selectedStatus == s} ? 'bg-gray-800 text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'"
           class="px-3 py-1.5 rounded-lg text-xs font-semibold transition"></a>
    </div>

    <!-- ===== ORDERS TABLE ===== -->
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
        <div th:if="${orders.isEmpty()}" class="py-16 text-center text-gray-400">
            <div class="text-4xl mb-2">📋</div>
            <p>No orders found.</p>
        </div>

        <table th:if="${!orders.isEmpty()}" class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                <tr>
                    <th class="px-4 py-3 text-left">Order #</th>
                    <th class="px-4 py-3 text-left">Customer</th>
                    <th class="px-4 py-3 text-left">Address</th>
                    <th class="px-4 py-3 text-left">Date</th>
                    <th class="px-4 py-3 text-right">Total</th>
                    <th class="px-4 py-3 text-center">Status</th>
                    <th class="px-4 py-3 text-center">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
                <tr th:each="order : ${orders}" class="hover:bg-gray-50 transition">
                    <td class="px-4 py-3 font-bold text-gray-700">#<span th:text="${order.id}"></span></td>
                    <td class="px-4 py-3">
                        <div class="font-medium text-gray-800" th:text="${order.customerName}"></div>
                        <div class="text-xs text-gray-400" th:text="'Items: ' + ${order.items.size()}"></div>
                    </td>
                    <td class="px-4 py-3 text-gray-500 max-w-[150px] truncate" th:text="${order.deliveryAddress}"></td>
                    <td class="px-4 py-3 text-gray-500 text-xs" th:text="${order.orderDate}"></td>
                    <td class="px-4 py-3 text-right font-bold text-orange-600">
                        Rs.<span th:text="${#numbers.formatDecimal(order.totalAmount,1,2)}"></span>
                    </td>
                    <td class="px-4 py-3 text-center">
                        <span th:text="${order.status}"
                              th:class="'text-xs font-semibold px-2 py-1 rounded-full ' + 'status-' + ${order.status.replace(' for Delivery','')}">
                        </span>
                    </td>
                    <td class="px-4 py-3">
                        <div class="flex items-center justify-center gap-2">
                            <!-- Update status -->
                            <button th:data-id="${order.id}"
                                    th:data-status="${order.status}"
                                    onclick="openStatusModal(this.dataset.id, this.dataset.status)"
                                    class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded-lg hover:bg-blue-100 transition font-medium">
                                Update
                            </button>
                            <!-- Delete -->
                            <form th:action="@{/admin/orders/delete/{id}(id=${order.id})}" method="post"
                                  onsubmit="return confirm('Delete order #' + this.dataset.id + '?')"
                                  th:data-id="${order.id}">
                                <button type="submit"
                                        class="text-xs bg-red-50 text-red-500 px-2 py-1 rounded-lg hover:bg-red-100 transition font-medium">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ===== UPDATE STATUS MODAL ===== -->
<div id="statusModal" class="modal">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm mx-4 p-6">
        <h2 class="text-lg font-bold text-gray-800 mb-4">Update Order Status</h2>
        <form id="statusForm" th:action="@{/admin/orders/update-status}" method="post">
            <input type="hidden" name="orderId" id="modalOrderId"/>
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">
                    Order #<span id="modalOrderDisplay"></span>
                </label>
                <select name="newStatus" id="modalStatus"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-orange-400">
                    <option th:each="s : ${allStatuses}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div class="flex gap-3">
                <button type="submit"
                        class="flex-1 bg-orange-500 text-white font-semibold py-2 rounded-lg hover:bg-orange-600 transition text-sm">
                    Save
                </button>
                <button type="button" onclick="closeStatusModal()"
                        class="flex-1 bg-gray-100 text-gray-600 font-semibold py-2 rounded-lg hover:bg-gray-200 transition text-sm">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function openStatusModal(orderId, currentStatus) {
        document.getElementById('modalOrderId').value      = orderId;
        document.getElementById('modalOrderDisplay').textContent = orderId;
        const sel = document.getElementById('modalStatus');
        for (let opt of sel.options) {
            opt.selected = (opt.value === currentStatus);
        }
        document.getElementById('statusModal').classList.add('open');
    }
    function closeStatusModal() {
        document.getElementById('statusModal').classList.remove('open');
    }
    // Close on backdrop click
    document.getElementById('statusModal').addEventListener('click', function(e) {
        if (e.target === this) closeStatusModal();
    });
</script>
</body>
</html>
